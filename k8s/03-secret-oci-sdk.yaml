apiVersion: v1
kind: Secret
metadata:
  name: gateway-oci-sdk
  namespace: gateway-prod
type: Opaque
stringData:
  # ~/.oci/config content
  config: |
    [DEFAULT]
    user=ocid1.user.oc1..replace
    fingerprint=replace:replace:replace:replace
    tenancy=ocid1.tenancy.oc1..replace
    region=us-chicago-1
    key_file=~/.oci/oci_api_key.pem
  # ~/.oci/oci_api_key.pem content
  oci_api_key.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----

