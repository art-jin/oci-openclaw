apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-anthropic-gateway
  namespace: gateway-prod
  labels:
    app: oci-anthropic-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oci-anthropic-gateway
  template:
    metadata:
      labels:
        app: oci-anthropic-gateway
    spec:
      imagePullSecrets:
        - name: ocir-cred
      containers:
        - name: gateway
          image: iad.ocir.io/replace-namespace/oci-gateway:replace-tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: gateway-debug-auth
          volumeMounts:
            - name: gateway-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: oci-sdk
              mountPath: /root/.oci/config
              subPath: config
              readOnly: true
            - name: oci-sdk
              mountPath: /root/.oci/oci_api_key.pem
              subPath: oci_api_key.pem
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
        - name: oci-sdk
          secret:
            secretName: gateway-oci-sdk

