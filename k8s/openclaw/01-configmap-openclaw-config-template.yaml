apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config-template
  namespace: openclaw-prod
data:
  base-openclaw.json: |
    {
      "agents": {
        "defaults": {
          "compaction": {
            "mode": "safeguard"
          },
          "model": {
            "primary": "oci-gateway/openai.gpt-5.2-2025-12-11"
          }
        },
        "list": [
          {
            "id": "main",
            "name": "main"
          }
        ]
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw"
      },
      "gateway": {
        "port": 18789,
        "mode": "local",
        "bind": "lan",
        "controlUi": {
          "allowedOrigins": [
            "http://localhost:18789",
            "http://127.0.0.1:18789"
          ],
          "dangerouslyAllowHostHeaderOriginFallback": true
        },
        "tailscale": {
          "mode": "off",
          "resetOnExit": false
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "oci-gateway": {
            "baseUrl": "__OPENCLAW_GATEWAY_BASE_URL__",
            "apiKey": "__OPENCLAW_GATEWAY_API_KEY__",
            "api": "anthropic-messages",
            "models": [
              {
                "id": "openai.gpt-5.2-2025-12-11",
                "name": "GPT 5.2 (OCI)",
                "contextWindow": 200000,
                "maxTokens": 8192
              }
            ]
          }
        }
      },
      "logging": {
        "level": "debug"
      }
    }
