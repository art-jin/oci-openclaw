apiVersion: v1
kind: Service
metadata:
  name: openclaw-internal
  namespace: openclaw-prod
  annotations:
    # Internal (private) load balancer in OCI
    oci.oraclecloud.com/load-balancer-internal: "true"
spec:
  type: LoadBalancer
  # Restrict who can reach the LB (source IP/CIDR)
  loadBalancerSourceRanges:
    - 10.0.0.246/32
  selector:
    app: openclaw
  ports:
    - name: http
      protocol: TCP
      port: 18789
      targetPort: gateway
