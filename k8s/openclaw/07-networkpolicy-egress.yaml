apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-egress-restrict
  namespace: openclaw-prod
spec:
  podSelector:
    matchLabels:
      app: openclaw
  policyTypes:
    - Egress
  egress:
    # Allow DNS to kube-dns (TCP/UDP 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow access to gateway service (TCP 8000) in gateway-prod
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-prod
          podSelector:
            matchLabels:
              app: oci-anthropic-gateway
      ports:
        - protocol: TCP
          port: 8000

